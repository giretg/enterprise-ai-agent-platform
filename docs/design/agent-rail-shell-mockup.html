<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E-AI Control Plane — Agent-sáv shell (látványterv v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================================
   DESIGN TOKENEK — 1:1 az app/src/app/globals.css @theme blokkjából.
   A fejlesztő NEM ezt a CSS-t viszi át: a Tailwind osztályok (bg-card, text-ink,
   border-line, .atelier-card …) már léteznek. Ez a fájl csak azért duplikálja
   őket, hogy a mockup buildeletlenül, dupla kattintással megnyíljon.
   ========================================================================== */
:root{
  --font-sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;

  --night:#f8f2e6; --night-2:#f1e8d6; --card:#fffdf8; --card-2:#fbf4e6;
  --paper:#fffdf8; --wash:#eef4ec; --line:#e8dcc4;
  --ink:#2c1e17; --ink-soft:#6c574a; --ink-faint:#9d8a78;
  --coral:#b23a55; --coral-deep:#8c2840; --honey:#b07d24; --sage:#5d8a4f;
  --rose:#c25f7d; --sky:#4d86a6; --grape:#7d5fae;

  --rail-w:336px; --rail-w-collapsed:76px; --header-h:64px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-sans); color:var(--ink); background-color:var(--night);
  background-image:
    radial-gradient(60rem 42rem at 6% -10%, rgba(178,58,85,.07), transparent 60%),
    radial-gradient(52rem 38rem at 104% 2%, rgba(176,125,36,.09), transparent 58%),
    radial-gradient(64rem 52rem at 50% 120%, rgba(93,138,79,.06), transparent 60%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased; overflow:hidden;
}
.font-display{font-family:var(--font-display);font-optical-sizing:auto;letter-spacing:-.012em}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:rgba(178,58,85,.18);color:var(--coral-deep)}

.atelier-card{
  background:linear-gradient(168deg,var(--card),var(--card-2));
  border:1px solid var(--line); border-radius:1.25rem;
  box-shadow:0 1px 0 0 rgba(255,255,255,.7) inset,0 1px 2px -1px rgba(70,45,30,.10),0 22px 44px -34px rgba(90,55,35,.40);
}
.soft{background:rgba(241,232,214,.55);border:1px solid rgba(214,196,164,.55);border-radius:1rem}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}

/* ── App váz ───────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh}

header.top{
  height:var(--header-h);flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:0 18px;border-bottom:1px solid var(--line);
  background:rgba(248,242,230,.82);backdrop-filter:blur(14px);position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(150deg,#8c2840,#b07d24);color:#fff;
  box-shadow:0 8px 18px -10px rgba(140,40,64,.8)
}
.brand b{font-family:var(--font-display);font-size:19px;letter-spacing:-.02em;line-height:1}
.brand span{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}

nav.main{display:flex;align-items:center;gap:2px;margin-left:8px}
nav.main button{
  border:0;background:transparent;padding:9px 13px;border-radius:10px;font-size:14px;font-weight:600;
  color:var(--ink-soft);display:flex;align-items:center;gap:6px
}
nav.main button:hover{background:rgba(232,220,196,.55);color:var(--ink)}
nav.main button .chev{font-size:10px;opacity:.55}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)
}
.pill .num{background:rgba(77,134,166,.14);color:var(--sky);border-radius:999px;padding:1px 8px;font-size:11.5px}
.seg{display:inline-flex;background:var(--night-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-faint)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--coral-deep);box-shadow:0 1px 2px rgba(70,45,30,.12)}
.avatar-me{width:34px;height:34px;border-radius:999px;background:linear-gradient(150deg,#7d5fae,#4d86a6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

.body{flex:1 1 auto;display:flex;min-height:0}

/* ── BAL SÁV: az agent-rail ────────────────────────────────────────────── */
.rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:rgba(255,253,248,.66);backdrop-filter:blur(8px);
  transition:flex-basis .22s ease,width .22s ease;
}
.rail.collapsed{width:var(--rail-w-collapsed);flex-basis:var(--rail-w-collapsed)}
.rail-head{padding:14px 14px 10px;flex:0 0 auto}
.rail-title{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.rail-title h2{font-family:var(--font-display);font-size:16px;margin:0;font-weight:700}
.rail-title .count{font-size:11.5px;color:var(--ink-faint);font-weight:600}
.icon-btn{
  border:1px solid var(--line);background:var(--card);border-radius:9px;width:30px;height:30px;
  display:grid;place-items:center;font-size:13px;color:var(--ink-soft)
}
.icon-btn:hover{background:var(--card-2);color:var(--ink)}
.rail-search{
  width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;
  padding:8px 11px 8px 30px;font:inherit;font-size:13px;color:var(--ink)
}
.rail-search::placeholder{color:var(--ink-faint)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;
  font-size:11.5px;font-weight:600;color:var(--ink-soft)
}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:5px;vertical-align:middle}

.rail-list{flex:1 1 auto;overflow-y:auto;padding:6px 12px 16px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.rail-foot{flex:0 0 auto;padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn-ghost{
  flex:1;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:9px;
  font-size:12.5px;font-weight:600;color:var(--ink-soft)
}
.btn-ghost:hover{background:var(--card);border-style:solid;color:var(--ink)}

/* ── Agent-kártya a sávban ─────────────────────────────────────────────── */
.agent{
  position:relative;text-align:left;width:100%;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(168deg,var(--card),var(--card-2));padding:11px 11px 10px;
  box-shadow:0 1px 2px -1px rgba(70,45,30,.08);transition:transform .12s ease,box-shadow .18s ease,border-color .18s ease;
}
.agent:hover{transform:translateY(-1px);box-shadow:0 10px 22px -18px rgba(90,55,35,.55);border-color:#dbcaa9}
.agent.active{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset,0 14px 28px -22px rgba(140,40,64,.6)}
.agent.active::before{
  content:"";position:absolute;left:-12px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--coral)
}
.agent-top{display:flex;gap:10px;align-items:flex-start}
.av{position:relative;flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;color:#fff}
.av .soul{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:999px;border:2px solid var(--card)}
.soul.busy{background:var(--sky);animation:pulse 1.1s ease-out infinite}
.soul.idle{background:var(--sage)}
.soul.wait{background:var(--honey);animation:pulse 1.6s ease-out infinite}
.soul.off{background:#c4b6a3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,134,166,.55)}50%{box-shadow:0 0 0 5px rgba(77,134,166,0)}}
.agent-id{min-width:0;flex:1}
.agent-id .nm{font-family:var(--font-display);font-size:15.5px;font-weight:700;line-height:1.1;display:flex;align-items:center;gap:5px}
.agent-id .role{font-size:11.5px;color:var(--ink-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{margin-top:9px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.state .lbl{font-weight:600}
.state .tm{margin-left:auto;font-size:10.5px;color:var(--ink-faint);font-family:var(--font-mono)}
.bar{margin-top:7px;height:4px;border-radius:999px;background:rgba(214,196,164,.5);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--grape));transition:width .8s linear}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.badge{border-radius:999px;padding:2.5px 8px;font-size:10.5px;font-weight:700;letter-spacing:.01em}
.b-wait{background:rgba(176,125,36,.16);color:#8a6013}
.b-new{background:rgba(178,58,85,.14);color:var(--coral-deep)}
.b-err{background:rgba(178,58,85,.18);color:var(--coral-deep)}
.b-mut{background:rgba(108,87,74,.12);color:var(--ink-soft)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{border-radius:9px;padding:7px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);flex:1}
.acts button.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.acts button.primary:hover{background:var(--coral-deep);border-color:var(--coral-deep)}
.acts button:hover{background:var(--card-2);color:var(--ink)}
.acts button.more{flex:0 0 34px}

/* ikon-mód (összecsukott sáv) */
.rail.collapsed .rail-head,.rail.collapsed .agent-id,.rail.collapsed .state,
.rail.collapsed .bar,.rail.collapsed .badges,.rail.collapsed .acts,.rail.collapsed .rail-foot .lbl-txt{display:none}
.rail.collapsed .rail-list{align-items:center;padding:12px 8px}
.rail.collapsed .agent{width:52px;padding:6px;border-radius:14px}
.rail.collapsed .agent-top{justify-content:center}

/* ── JOBB OLDAL: workspace ─────────────────────────────────────────────── */
.work{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.work-head{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:rgba(255,253,248,.55);backdrop-filter:blur(6px)
}
.work-head .av{width:38px;height:38px;border-radius:12px;font-size:17px}
.work-id .nm{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.15}
.work-id .sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.tabs{display:flex;gap:3px;margin-left:18px;background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-faint)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--coral-deep);box-shadow:0 1px 2px rgba(70,45,30,.12)}
.work-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.work-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:20px 24px 26px}
.pane{display:none;animation:rise .4s cubic-bezier(.22,1,.36,1) both}
.pane.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* üres állapot */
.empty{max-width:640px;margin:8vh auto 0;text-align:center}
.empty .big{font-family:var(--font-display);font-size:34px;font-weight:900;letter-spacing:-.02em;margin:0 0 10px}
.empty p{color:var(--ink-soft);font-size:15px;line-height:1.6;margin:0 auto 22px;max-width:52ch}
.empty .hintbox{text-align:left;padding:16px 18px;border-radius:16px}
.empty .hintbox h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.empty .hintbox li{font-size:13.5px;color:var(--ink-soft);margin:5px 0}

/* chat */
.chat{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .who{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px;color:#fff}
.msg .bub{border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.6;max-width:76%}
.msg.a .bub{background:var(--card);border:1px solid var(--line)}
.msg.u{flex-direction:row-reverse}
.msg.u .bub{background:rgba(178,58,85,.10);border:1px solid rgba(178,58,85,.22)}
.msg.u .who{background:linear-gradient(150deg,#7d5fae,#4d86a6)}
.trace{
  border-left:2px solid rgba(77,134,166,.35);padding:6px 0 6px 12px;margin:4px 0 0;font-family:var(--font-mono);
  font-size:11.5px;color:var(--ink-faint);display:flex;flex-direction:column;gap:3px
}
.gate{
  border:1px solid rgba(176,125,36,.45);background:rgba(176,125,36,.09);border-radius:14px;padding:13px 15px;
}
.gate h5{margin:0 0 4px;font-size:13.5px}
.gate p{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.gate .row{display:flex;gap:8px}
.gate button{border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.gate button.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.composer{
  position:sticky;bottom:0;margin-top:6px;padding:10px;border-radius:16px;border:1px solid var(--line);
  background:var(--paper);display:flex;gap:9px;align-items:flex-end;box-shadow:0 -8px 20px -22px rgba(90,55,35,.6)
}
.composer textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:14px;background:transparent;min-height:44px;color:var(--ink)}
.send{border:0;background:var(--coral);color:#fff;border-radius:11px;padding:10px 18px;font-weight:700;font-size:13.5px}

/* feladat / mini-app / adatlap panelek */
.grid2{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;align-items:start;max-width:1080px}
.card{padding:16px 18px;border-radius:16px}
.card h3{font-family:var(--font-display);font-size:16px;margin:0 0 4px}
.card .lead{font-size:12.5px;color:var(--ink-faint);margin:0 0 14px;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px}
.f-in,.f-ta,select.f-in{
  width:100%;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 11px;
  font:inherit;font-size:13.5px;color:var(--ink)
}
.f-ta{min-height:96px;resize:vertical}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:var(--coral-deep)}
.steps{list-style:none;margin:0;padding:0;font-size:13px}
.steps li{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:10px}
.steps li+li{margin-top:2px}
.steps .k{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
.steps .done .k{background:var(--sage)}
.steps .run{background:rgba(77,134,166,.10)}
.steps .run .k{background:var(--sky);animation:pulse 1.1s ease-out infinite}
.steps .todo{opacity:.55}
.steps .todo .k{background:#c9baa4}
.steps .t{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint)}
.applist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:1080px}
.app-t{padding:14px 15px;border-radius:15px;text-align:left}
.app-t .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(125,95,174,.14);margin-bottom:9px}
.app-t b{font-size:14px;display:block}
.app-t small{color:var(--ink-faint);font-size:11.5px;display:block;margin-top:3px;line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-faint);font-size:12px}
.kv dd{margin:0}

/* ── MODAL réteg (minden header-menü ide nyílik) ───────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(44,30,23,.34);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:28px;
}
.scrim.on{display:flex;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:linear-gradient(168deg,var(--card),var(--card-2));border:1px solid var(--line);border-radius:20px;
  box-shadow:0 40px 90px -50px rgba(60,35,20,.75);width:100%;max-height:100%;display:flex;flex-direction:column;
  animation:pop .22s cubic-bezier(.22,1,.36,1) both
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal.sz-s{max-width:520px}
.modal.sz-m{max-width:860px}
.modal.sz-l{max-width:1180px;height:min(88vh,900px)}
.modal.sz-full{max-width:none;width:100%;height:100%;border-radius:16px}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.modal-head .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.modal-head h3{font-family:var(--font-display);font-size:19px;margin:2px 0 0;font-weight:700}
.modal-head .x{margin-left:auto}
.modal-body{padding:18px 20px 22px;overflow:auto;flex:1 1 auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:0 0 auto}

/* header legördülő (menü → tétel-lista) */
.menu{
  position:absolute;top:calc(var(--header-h) - 8px);border:1px solid var(--line);border-radius:14px;padding:6px;
  background:var(--card);box-shadow:0 26px 50px -32px rgba(70,45,30,.6);min-width:250px;z-index:40;display:none
}
.menu.on{display:block;animation:pop .14s ease both}
.menu button{
  display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;border-radius:9px;
  padding:8px 10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);text-align:left
}
.menu button:hover{background:var(--night-2);color:var(--ink)}
.menu .sect{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:9px 10px 4px}
.menu .tag{margin-left:auto;font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

/* fejlesztői jegyzet */
.devnote{border-left:3px solid var(--sky);background:rgba(77,134,166,.07);border-radius:0 12px 12px 0;padding:11px 14px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin:14px 0}
.devnote b{color:var(--ink)}
code{font-family:var(--font-mono);font-size:12px;background:rgba(214,196,164,.35);border-radius:5px;padding:1px 5px}
.speclist{font-size:13.5px;line-height:1.75;color:var(--ink-soft);padding-left:20px}
.speclist b{color:var(--ink)}
table.spec{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 14px}
table.spec th,table.spec td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.spec th{background:rgba(241,232,214,.6);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}

.fab{
  position:fixed;right:18px;bottom:18px;z-index:60;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--ink-soft);
