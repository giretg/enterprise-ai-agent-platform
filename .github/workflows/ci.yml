name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Egy PR-hoz elég a legfrissebb futás; a korábbiakat megszakítjuk.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # CodeQL SARIF feltöltéshez

jobs:
  verify:
    name: Lint · tsc · prisma · stub-tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # WP-1 fail-closed: NODE_ENV=test alatt a titkok dev-defaultra eshetnek (nem prod-throw),
      # így a modul-szintű secret-resolver nem blokkolja a boot-ot / a teszteket.
      NODE_ENV: test
      # A séma pooler + direct URL-t is használ (Neon-minta); prisma validate mindkettőt kéri.
      DATABASE_URL: postgresql://stub:stub@127.0.0.1:5432/stub
      DIRECT_URL: postgresql://stub:stub@127.0.0.1:5432/stub
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # A postinstall (prisma generate) az npm ci alatt lefut; a NODE_ENV=test
      # nem szűri ki a devDependencies-t, mert az npm csak a --production flagre figyel.
      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: ESLint
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Stub-DB domain tests
        run: |
          npm run test:secret-config
          npm run test:audit-log
          npm run test:sandbox-csp
          npm run test:observability
          npm run test:health-endpoints
          npm run test:tool-broker-tenant
          npm run test:user-directory
          npm run test:provisioning-errors
          npm run test:provisioning-governance
          npm run test:dispatch-budget
          npm run test:dispatch-board-ticket-schema
          npm run test:playbook-v2-process
          npm run test:n-plus-one-batch
          npm run test:list-pagination
          npm run test:playbook-v2-registry
          npm run test:playbook-process-def
          npm run test:iam-policy
          npm run test:agent-access-graph
          npm run test:memory-approval
          npm run test:training-tenant
          npm run test:memory-conflicts
          npm run test:memory-content-guard
          npm run test:memory-maintenance-rollback
          npm run test:chat-thinking-trace
          npm run test:chat-tool-history
          npm run test:context-compactor
          npm run test:agent-turn-record
          npm run test:agent-runtime-display-loader
          npm run test:agent-turn-snapshot
          npm run test:agent-turn-reconnect
          npm run test:chat-stream-recovery
          npm run test:agent-turn-watchdog
          npm run test:loop-stop
          npm run test:http-api
          npm run test:http-api-per-agent-key
          npm run test:connector-template
          npm run test:provisioning
          npm run test:connector-secret-alias-policy
          npm run test:connector-api-key-rotate
          npm run test:file-search-safe
          npm run test:channel-linking
          npm run test:channel-turn
          npm run test:channel-metrics
          npm run test:channel-retention
          npm run test:channel-agent-access
          npm run test:channel-approval
          npm run test:ttl-secret-cache
          npm run test:public-routes
          npm run test:conversation-session
          npm run test:agent-interaction-ticket
          npm run test:tool-trust
          npm run test:consequence-gate
          npm run test:consequence-approval
          npm run test:skill-catalog
          npm run test:turn-continuation
          npm run test:agent-ask-deadline
          npm run test:skill-runtime-followup
          npm run test:debug-log-export
          npm run test:prompt-assembler
          npm run test:prompt-cache

      # Prompt-eval A fázis — piros vonalak (issue #35). SZÁNDÉKOSAN külön lépés:
      # ez biztonsági kapu, nem funkcionális teszt. Ha elbukik, egy prompt-módosítás
      # áttört egy invariánst (hurok / tenant-határ / SoD / írás-engedély /
      # szenzitív-kiszivárgás) — nem felülbírálható, a változás így nem élesíthető.
      # Nem hív modellt és nem kerül tokenbe: a költségkeret nem tudja kiéheztetni.
      - name: Piros vonalak (prompt-eval, blokkoló)
        run: npm run test:prompt-eval

  migrations:
    name: Prisma migrate deploy (ephemeral Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Amíg a DB nem fogad kapcsolatot, a job várjon.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Ephemeral CI-DB — nincs pooler, a direct URL ugyanaz.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A teljes verziózott migrációs lánc (baseline + trigger + FTS-index) hibátlanul
      # alkalmazható egy üres Postgresre → nincs drift, nincs kézi db push függés.
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      # A DB sémája megegyezik a migrációk által leírttal (nincs pending / nincs eltérés).
      - name: Prisma migrate status
        run: npx prisma migrate status

      # Az aktív-forduló invariánst (chat-agent-turn-resilience-spec.md D7) egy
      # RÉSZLEGES EGYEDI INDEX kényszeríti ki — ezt csak valódi Postgres ellen
      # lehet bizonyítani, ezért a stub-DB-s suite helyett itt fut.
      - name: Agent-forduló repository tesztek
        run: npm run test:agent-turn

      # Az agent-hozzáférési gráf DB-szintű invariánsai (#142): a subject-alak, a
      # „legalább egy ige", a self-edge és a subject→target egyediség CHECK/UNIQUE
      # kényszereit, valamint a cross-table tenant-invariáns TRANZAKCIÓS ellenőrzését
      # csak valódi Postgres ellen lehet bizonyítani.
      - name: Agent-hozzáférési gráf DB-invariánsok
        run: npm run test:agent-access-grant-db

  security-scan:
    name: Titok-szkennelés + CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      # A gitleaks-action pull_request eseménynél a PR commitjait listázza
      # (GET /pulls/{n}/commits) — ehhez pull-requests:read kell, különben 403
      # („Resource not accessible by integration") és elbukik a titok-szkennelés.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks a teljes history-t szkennelje

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A CodeQL végigfut, de a SARIF-eredmény feltöltése CSAK akkor sikeres, ha a repóban
      # be van kapcsolva a Code scanning (Settings → Code security & analysis). Amíg nincs,
      # a feltöltés „configuration error"-t ad. Ezért a CodeQL lépések NEM blokkolják a CI-t
      # (continue-on-error) — a gitleaks titok-szkennelés éles marad. Ha a Code scanning
      # bekapcsol, a continue-on-error eltávolítható, és a CodeQL-eredmények bekerülnek.
      - name: CodeQL init
        uses: github/codeql-action/init@v4
        continue-on-error: true
        with:
          languages: typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: /language:typescript
