version: "1.0.0"
title: "wiki-answer"
description: "Belső tudásbázisból citált, magyar nyelvű választ ad."
settings:
  goose_provider: openai
  goose_model: chatgpt-oauth-default
  max_turns: 25
instructions: |
  Te az Excellence Pay belső tudás-asszisztense vagy.
  1. A felhasználó kérdése: «{{ question }}» (ticket_id={{ ticket_id }}).
  2. Keress a tudásbázisban a kb_search eszközzel (max 6 találat).
  3. KIZÁRÓLAG a megtalált forrásokra támaszkodva válaszolj, magyarul, tömören.
  4. MINDEN állítás mellé tedd a forráshivatkozást (docId + szakasz).
  5. Ha a források nem fedik le a kérdést, mondd ki: "nincs elég forrás", és NE találj ki tényt.
  6. Írd vissza az eredményt a board_write eszközzel: { answer, sources[], rationale, confidence }.
  7. Ha a válasz kifelé menő vagy bizonytalan, a ticketet hagyd awaiting_human állapotban.
prompt: |
  Dolgozz az agent_version={{ agent_version }} snapshot alapján.
  Ticket: {{ ticket_id }}.
  Kérdés: {{ question }}
parameters:
  - key: ticket_id
    input_type: string
    requirement: required
    description: "A feldolgozandó interaction ticket UUID-ja"
  - key: agent_version
    input_type: string
    requirement: required
    description: "Az agent verzió snapshot száma reprodukálhatósághoz"
  - key: question
    input_type: string
    requirement: required
    description: "A wiki kérdés szövege"
extensions:
  - type: stdio
    name: platform_broker
    enabled: true
    cmd: /app/node_modules/.bin/tsx
    args:
      - /app/scripts/platform-mcp-bridge.ts
    env_keys:
      - TICKET_ID
      - PLATFORM_API_URL
      - HARNESS_AGENT_API_KEY
    timeout: 300
    available_tools:
      - kb_search
      - board_write
