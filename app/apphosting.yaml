# Firebase App Hosting — Fázis 1 backend
# Secrets: npx -y firebase-tools@latest apphosting:secrets:set SECRET_NAME
# Grant:   npx -y firebase-tools@latest apphosting:secrets:grantaccess

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: DIRECT_URL
    secret: DIRECT_URL
    availability:
      - BUILD
  - variable: DATABASE_URL_TEST
    secret: DATABASE_URL_TEST
    availability:
      - BUILD
      - RUNTIME
  - variable: DIRECT_URL_TEST
    secret: DIRECT_URL_TEST
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY
  - variable: OPENROUTER_BASE_URL
    value: "https://openrouter.ai/api/v1"
  - variable: OPENROUTER_APP_TITLE
    value: "Enterprise AI Agent Platform"
  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY
  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: HARNESS_CALLBACK_TOKEN
    secret: HARNESS_CALLBACK_TOKEN
    availability:
      - RUNTIME
  # Cloud Scheduler → POST /api/v1/internal/dispatch-cycle hitelesítés (x-dispatcher-token
  # fejléc). Ugyanaz a token, mint a lokális worker /control/stop végpontjáé — korábban csak
  # .env.local-ban élt, de a Scheduler az éles App Hosting instance-t hívja, ezért itt is kell.
  - variable: DISPATCHER_CONTROL_TOKEN
    secret: DISPATCHER_CONTROL_TOKEN
    availability:
      - RUNTIME
  # Stabil Server Action ID-k build/deploy között (version skew ellen).
  - variable: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    secret: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    availability:
      - BUILD
      - RUNTIME
  # --- ChatGPT OAuth Model Gateway (beágyazott, Secret Manager) ---
  - variable: CHATGPT_OAUTH_EMBEDDED
    value: "true"
    availability:
      - RUNTIME
  - variable: CHATGPT_OAUTH_TOKEN_SECRET
    value: "projects/346824017066/secrets/CHATGPT_OAUTH_TOKENS"
    availability:
      - RUNTIME
  - variable: CHATGPT_OAUTH_MODEL
    value: "gpt-5.5"
    availability:
      - RUNTIME
  # --- Gmail per-user connector (OAuth) ---
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://enterprise-ai-agent-platform--enterprise-ai-demo.europe-west4.hosted.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: GMAIL_OAUTH_CLIENT_ID
    value: "346824017066-ioi488qcq2q7srm9isd4qmepdi75aj69.apps.googleusercontent.com"
    availability:
      - RUNTIME
  - variable: GMAIL_OAUTH_CLIENT_SECRET
    secret: GMAIL_OAUTH_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: GMAIL_OAUTH_REDIRECT_URI
    value: "https://enterprise-ai-agent-platform--enterprise-ai-demo.europe-west4.hosted.app/api/connectors/oauth/callback"
    availability:
      - RUNTIME
  # --- Agent workspace storage (file editor, GCS) ---
  - variable: WORKSPACE_BUCKET
    value: "platform-workspace-prod"
    availability:
      - RUNTIME
  - variable: GCS_SERVICE_ACCOUNT_EMAIL
    value: "platform-workspace@enterprise-ai-demo.iam.gserviceaccount.com"
    availability:
      - RUNTIME
  # --- Provisioning Assistant (connector onboarding) ---
  - variable: PROVISIONING_EGRESS_ALLOWLIST
    value: "posnavigator.eu"
    availability:
      - RUNTIME
  # --- Fail-closed aláíró/titkosító titkok (WP-1 / review F1) ---
  # Prod alatt KÖTELEZŐ: hiányukban a folyamat boot-kor leáll (secret-resolver.ts),
  # így élesben nincs hamisítható dev-default. Érték: openssl rand -hex 32.
  - variable: WRITE_GATE_SECRET
    secret: WRITE_GATE_SECRET
    availability:
      - RUNTIME
  - variable: OAUTH_STATE_SECRET
    secret: OAUTH_STATE_SECRET
    availability:
      - RUNTIME
  - variable: SANDBOX_PREVIEW_SECRET
    secret: SANDBOX_PREVIEW_SECRET
    availability:
      - RUNTIME
