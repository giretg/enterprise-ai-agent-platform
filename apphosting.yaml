# Firebase App Hosting — root config for GitHub-connected builds
# Keep this in sync with app/apphosting.yaml while the backend builds from repo root.
# Secrets: npx -y firebase-tools@latest apphosting:secrets:set SECRET_NAME
# Grant:   npx -y firebase-tools@latest apphosting:secrets:grantaccess

runConfig:
  cpu: 1
  # 2026-09-06: az `1024 / concurrency 40` beállítás ismét OOM-killt okozott az
  # agent-chat alatt (l. e1a92700 első próbálkozás 512/80 → 1024/40). Egy 1 vCPU-s
  # instance-en a hosszú életű chat-stream + inline HTML-riport előnézet (a
  # workspace/files route a teljes fájlt bufferbe olvassa) párhuzamosan tolta 1 GiB
  # fölé. Kevesebb egyidejű kérés/instance → az autoscaler több instance-re teríti
  # a terhelést; +dupla memória a maradék csúcsokra. Visszaállítás: állítsd vissza
  # 1024 / 40-re. Tartós megoldás: agent-runtime leválasztása az UI szolgálatról (#114).
  memoryMiB: 2048
  minInstances: 0
  maxInstances: 10
  concurrency: 10

env:
  # A projektben az `ostorosbor-crm` backend is fut, és a névtelen DATABASE_URL /
  # DIRECT_URL secreteken osztoznánk vele: a CRM deployja felülírja őket a saját
  # adatbázisával, amit a platform a KÖVETKEZŐ deployján venne fel (P2021: a
  # public.users nem létezik). A platform ezért saját névtérrel olvas.
  - variable: DATABASE_URL
    secret: PLATFORM_DATABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: DIRECT_URL
    secret: PLATFORM_DIRECT_URL
    availability:
      - BUILD
  - variable: DATABASE_URL_TEST
    secret: DATABASE_URL_TEST
    availability:
      - BUILD
      - RUNTIME
  - variable: DIRECT_URL_TEST
    secret: DIRECT_URL_TEST
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY
  - variable: OPENROUTER_BASE_URL
    value: "https://openrouter.ai/api/v1"
  - variable: OPENROUTER_APP_TITLE
    value: "Enterprise AI Agent Platform"
  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY
  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: HARNESS_CALLBACK_TOKEN
    secret: HARNESS_CALLBACK_TOKEN
    availability:
      - RUNTIME
  # Cloud Scheduler → POST /api/v1/internal/dispatch-cycle (x-dispatcher-token).
  - variable: DISPATCHER_CONTROL_TOKEN
    secret: DISPATCHER_CONTROL_TOKEN
    availability:
      - RUNTIME
  - variable: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    secret: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: CHATGPT_OAUTH_EMBEDDED
    value: "true"
    availability:
      - RUNTIME
  - variable: CHATGPT_OAUTH_TOKEN_SECRET
    value: "projects/346824017066/secrets/CHATGPT_OAUTH_TOKENS"
    availability:
      - RUNTIME
  - variable: CHATGPT_OAUTH_MODEL
    value: "gpt-5.5"
    availability:
      - RUNTIME
  # --- Gmail per-user connector (OAuth) ---
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://enterprise-ai-agent-platform--enterprise-ai-demo.europe-west4.hosted.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: GMAIL_OAUTH_CLIENT_ID
    value: "346824017066-ioi488qcq2q7srm9isd4qmepdi75aj69.apps.googleusercontent.com"
    availability:
      - RUNTIME
  - variable: GMAIL_OAUTH_CLIENT_SECRET
    secret: GMAIL_OAUTH_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: GMAIL_OAUTH_REDIRECT_URI
    value: "https://enterprise-ai-agent-platform--enterprise-ai-demo.europe-west4.hosted.app/api/connectors/oauth/callback"
    availability:
      - RUNTIME
  # --- Agent workspace storage (file editor, GCS) ---
  - variable: WORKSPACE_BUCKET
    value: "platform-workspace-prod"
    availability:
      - RUNTIME
  - variable: GCS_SERVICE_ACCOUNT_EMAIL
    value: "platform-workspace@enterprise-ai-demo.iam.gserviceaccount.com"
    availability:
      - RUNTIME
  # --- Sandbox App Registry artifact store (mini-app HTML, GCS) ---
  - variable: SANDBOX_APP_BUCKET
    value: "platform-sandbox-apps-prod"
    availability:
      - RUNTIME
  # --- Provisioning Assistant (connector onboarding) ---
  - variable: PROVISIONING_EGRESS_ALLOWLIST
    value: "posnavigator.eu"
    availability:
      - RUNTIME
  # --- Worker-processes admin panel (control-plane/system): a dispatch-cycle-sweep Cloud
  # Scheduler job státusza/szüneteltetése, Admin API-n át (metadata-server ambient token,
  # nincs Bearer secret). A lokális worker (LOCAL_WORKER_CONTROL_URL/DISPATCHER_CONTROL_TOKEN)
  # szándékosan nincs itt — az élő konténernek nincs elérése a te laptopod localhost-jához.
  - variable: DISPATCHER_ADMIN_PROJECT_ID
    value: "enterprise-ai-demo"
    availability:
      - RUNTIME
  - variable: DISPATCHER_ADMIN_REGION
    value: "europe-west4"
    availability:
      - RUNTIME
  # --- Fail-closed aláíró/titkosító titkok (WP-1 / review F1) ---
  # Prod alatt KÖTELEZŐ: hiányukban a folyamat boot-kor leáll (secret-resolver.ts),
  # így élesben nincs hamisítható dev-default. Érték: openssl rand -hex 32.
  - variable: WRITE_GATE_SECRET
    secret: WRITE_GATE_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: OAUTH_STATE_SECRET
    secret: OAUTH_STATE_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: SANDBOX_PREVIEW_SECRET
    secret: SANDBOX_PREVIEW_SECRET
    availability:
      - BUILD
      - RUNTIME
  # Connector API-kulcsok (web_search custom + platform-hosted) — Secret Manager.
  - variable: CONNECTOR_SECRET_PREFIX
    value: "projects/346824017066/secrets"
    availability:
      - RUNTIME
  # Per-user OAuth grant tokenek (Gmail stb.) — Secret Manager; nélküle .connector-grants fájl
  # az ephemeral konténer FS-en (deploy/restart után ENOENT).
  - variable: CONNECTOR_GRANT_SECRET_PREFIX
    value: "projects/346824017066/secrets"
    availability:
      - RUNTIME
